services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devbox
      POSTGRES_USER: devbox
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a unique DB_PASSWORD in .env}
    volumes:
      - devbox_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbox -d devbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  egress-proxy:
    restart: unless-stopped
    build:
      context: .
      dockerfile: egress-proxy.Dockerfile
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - egress_internal
      - egress_public

  broker:
    restart: unless-stopped
    depends_on:
      egress-proxy:
        condition: service_started
    build:
      context: .
      dockerfile: broker.Dockerfile
    environment:
      DEVBOX_BROKER_TOKEN: ${BROKER_SERVICE_TOKEN:?Set BROKER_SERVICE_TOKEN in .env}
      DEVBOX_WORKSPACE_STORAGE_ROOT: ${WORKSPACE_STORAGE_ROOT:-/srv/devbox/workspaces}
      DEVBOX_SNAPSHOT_STORAGE_ROOT: ${SNAPSHOT_STORAGE_ROOT:-/srv/devbox/snapshots}
      DEVBOX_WORKSPACE_DISK_QUOTA: ${WORKSPACE_DISK_QUOTA:-10g}
      DEVBOX_SNAPSHOT_DISK_QUOTA: ${SNAPSHOT_DISK_QUOTA:-20g}
      DEVBOX_WORKSPACE_INODE_LIMIT: ${WORKSPACE_INODE_LIMIT:-200000}
      DEVBOX_SNAPSHOT_INODE_LIMIT: ${SNAPSHOT_INODE_LIMIT:-50000}
      DEVBOX_BROKER_STATE_ROOT: /var/lib/devbox-broker
      DEVBOX_RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-60}
    cap_add:
      - SYS_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_STORAGE_ROOT:-/srv/devbox/workspaces}:${WORKSPACE_STORAGE_ROOT:-/srv/devbox/workspaces}
      - ${SNAPSHOT_STORAGE_ROOT:-/srv/devbox/snapshots}:${SNAPSHOT_STORAGE_ROOT:-/srv/devbox/snapshots}
      - broker_state:/var/lib/devbox-broker
    networks:
      - broker_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    nano_cpus: 1000000000
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,noexec,nosuid,size=16m
    depends_on:
      egress-proxy:
        condition: service_started
      broker:
        condition: service_healthy
    build:
      context: .
      dockerfile: worker.Dockerfile
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      DEVBOX_EXECUTOR_TOKEN: ${EXECUTOR_SERVICE_TOKEN:?Set EXECUTOR_SERVICE_TOKEN in .env}
      DEVBOX_BROKER_URL: http://broker:9100
      DEVBOX_BROKER_TOKEN: ${BROKER_SERVICE_TOKEN:?Set BROKER_SERVICE_TOKEN in .env}
      DEVBOX_WORKSPACE_STORAGE_ROOT: ${WORKSPACE_STORAGE_ROOT:-/srv/devbox/workspaces}
      DEVBOX_WORKSPACE_DISK_QUOTA: ${WORKSPACE_DISK_QUOTA:-10g}
      DEVBOX_WORKSPACE_INODE_LIMIT: ${WORKSPACE_INODE_LIMIT:-200000}
      DEVBOX_SNAPSHOT_STORAGE_ROOT: ${SNAPSHOT_STORAGE_ROOT:-/srv/devbox/snapshots}
      DEVBOX_SNAPSHOT_DISK_QUOTA: ${SNAPSHOT_DISK_QUOTA:-20g}
      DEVBOX_SNAPSHOT_INODE_LIMIT: ${SNAPSHOT_INODE_LIMIT:-50000}
      DEVBOX_SNAPSHOT_ENCRYPTION_KEY: ${SNAPSHOT_ENCRYPTION_KEY:-}
      DEVBOX_SNAPSHOT_MAX_COUNT: ${SNAPSHOT_MAX_COUNT:-10}
      DEVBOX_SNAPSHOT_MAX_BYTES: ${SNAPSHOT_MAX_BYTES:-10737418240}
      DEVBOX_RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-60}
    networks:
      - default
      - broker_internal
    volumes:
      - ${WORKSPACE_STORAGE_ROOT:-/srv/devbox/workspaces}:${WORKSPACE_STORAGE_ROOT:-/srv/devbox/workspaces}
      - ${SNAPSHOT_STORAGE_ROOT:-/srv/devbox/snapshots}:${SNAPSHOT_STORAGE_ROOT:-/srv/devbox/snapshots}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devbox:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/devbox
      EXECUTOR_SERVICE_URL: http://worker:9000
      EXECUTOR_SERVICE_TOKEN: ${EXECUTOR_SERVICE_TOKEN:?Set EXECUTOR_SERVICE_TOKEN in .env}
      LIFECYCLE_RECONCILE_INTERVAL_SECONDS: ${LIFECYCLE_RECONCILE_INTERVAL_SECONDS:-60}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    networks:
      - default
      - api_proxy
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  devbox_postgres:
  broker_state:

networks:
  egress_internal:
    name: devbox_egress_internal
    internal: true
  egress_public:
    name: devbox_egress_public
  api_proxy:
    name: devbox_api_proxy
    internal: true
  broker_internal:
    name: devbox_broker_internal
    internal: true
