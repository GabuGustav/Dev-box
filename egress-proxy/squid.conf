http_port 3128

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

# Deny non-global IPv4 destinations, including deprecated transition ranges.
acl to_local dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4

# Deny IPv6 local/special ranges and IPv4 transition mechanisms that can
# encode private IPv4 destinations.
acl to_local dst ::/96 ::ffff:0:0/96 fc00::/7 fe80::/10 ff00::/8
acl to_local dst 64:ff9b::/96 64:ff9b:1::/48 100::/64
acl to_local dst 2001::/23 2001:db8::/32 2002::/16 3fff::/20

acl allowed_domains dstdomain .github.com .githubusercontent.com .gitlab.com .bitbucket.org .pypi.org .pythonhosted.org

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_local
http_access allow allowed_domains
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
