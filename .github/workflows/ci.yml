name: CI

on:
  push:
    branches: ["main", "phase-1-core-platform", "phase-2-isolated-workspaces"]
  pull_request:
    branches: ["main", "phase-1-core-platform"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build restricted egress proxy
        run: docker build --file egress-proxy.Dockerfile --tag devbox-egress-proxy:ci .
      - name: Build Git-enabled workspace image
        run: docker build --file workspace-image/Dockerfile --tag devbox-workspace:ci .
      - name: Validate Docker Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=app --cov=worker --cov-report=term-missing
